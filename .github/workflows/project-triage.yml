name: Project triage

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  check_run:
    types: [completed]
  workflow_run:
    workflows: [Checks, Claude Code Review, Test]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply labels and DCO status (off previews only)
        type: boolean
        default: false

# All writes are metadata. The trusted default branch is the only code executed,
# including for fork PRs and workflow_run; no PR checkout, artifacts, or secrets.
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  actions: read
  statuses: write

concurrency:
  group: project-triage
  cancel-in-progress: true

jobs:
  triage:
    if: github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Reconcile project metadata
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          python3 scripts/project_triage.py "${args[@]}" --summary "$GITHUB_STEP_SUMMARY"
