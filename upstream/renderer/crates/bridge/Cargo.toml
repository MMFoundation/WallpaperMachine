[package]
name = "wallpaper-bridge"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[lib]
name = "wallpaper_bridge"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi.rs"

[dependencies]
wallpaper-core = { path = "../core" }
anyhow = { workspace = true }
arc-swap = "1.9.1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-queue = "0.3"
dirs = "5"
fs2 = "0.4"
futures-util = "0.3"
# R2-BCARGO: to be written from spec
objc2-io-kit = "0.3.2"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wallpaper-core = { path = "../core", features = ["bridge-contract-tests"] }
