[package]
name = "wallpaper-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
bridge-contract-tests = []

[dependencies]
arc-swap = "1.9.1"
kameo = "0.20.0"
libc = "0.2"
# R2-CCARGO: to be written from spec
serde_json = "1.0"
wm-shader = { path = "../../../../Renderer/Shader", features = ["ffi"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-channel = "2"
block2 = "0.6.2"
crossbeam-queue = "0.3"
dispatch2 = { version = "0.3", default-features = false, features = ["alloc"] }


[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

# Unattached Core Animation layers are exercised on the process's main thread.
[[test]]
name = "wallpaper_background"
harness = false

[build-dependencies]
cmake = "0.1.58"
bindgen = "0.72.1"
